[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-assistant"
version = "1.0.0"
description = "دستیار هوشمند Microsoft Excel 2024 به زبان فارسی"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "xlwings>=0.30.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.0.0",
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
]

[project.scripts]
excel-assistant = "excel_assistant.main:main"
excel-ai = "excel_assistant.main:main"
